
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEFFERSON AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 20px;
  background: #101a2d;
  border-bottom: 1px solid #26344c;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: #63a8ff;
}

.status {
  font-size: 12px;
  color: #48d99b;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 25px 15px 130px;
}

.welcome {
  text-align: center;
  margin: 50px 0 30px;
}

.welcome h1 {
  font-size: 32px;
  margin-bottom: 12px;
}

.welcome span {
  color: #63a8ff;
}

.welcome p {
  color: #a8b4c8;
}

#messages {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.message {
  padding: 15px;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #174b85;
  align-self: flex-end;
}

.ai {
  background: #172338;
  align-self: flex-start;
}

.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #080d18;
  padding: 15px;
  border-top: 1px solid #26344c;
}

.input-box {
  max-width: 850px;
  margin: auto;
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 16px;
  border: 1px solid #354663;
  border-radius: 12px;
  background: #172338;
  color: white;
  outline: none;
}

button {
  padding: 15px 20px;
  background: #2879dc;
  border: none;
  border-radius: 12px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#hint {
  color: #8795aa;
  text-align: center;
  font-size: 11px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">JEFFERSON AI</div>
  <div class="status">● AI ASSISTANT</div>
</header>

<main>
  <section class="welcome" id="welcome">
    <h1>Hello, I'm <span>JEFFERSON AI</span></h1>
    <p>Your intelligent AI assistant. How can I help you today?</p>
  </section>

  <div id="messages"></div>
</main>

<div class="input-area">
  <form class="input-box" id="chatForm">
    <input
      id="userInput"
      type="text"
      placeholder="Ask Jefferson AI anything..."
      autocomplete="off"
      required
    >
    <button id="sendBtn" type="submit">Send</button>
  </form>
  <p id="hint">JEFFERSON AI • Your personal AI assistant</p>
</div>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");
const messages = document.getElementById("messages");
const button = document.getElementById("sendBtn");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const message = input.value.trim();
  if (!message || button.disabled) return;

  document.getElementById("welcome").style.display = "none";

  addMessage(message, "user");
  input.value = "";
  button.disabled = true;
  button.textContent = "...";

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed.");
    }

    addMessage(data.reply, "ai");

  } catch (error) {
    addMessage(error.message, "ai");
  }

  button.disabled = false;
  button.textContent = "Send";
  input.focus();
});
</script>

</body>
</html>
